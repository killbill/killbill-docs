<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Entourage components: Aviate Admin answers environment-level questions, Kaui answers account-level questions, both read from Kill Bill as the system of record">

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#98A2B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Operator -->
  <text x="350" y="24" text-anchor="middle" font-size="13" fill="#667085">Billing, support and finance operators</text>

  <line x1="185" y1="34" x2="185" y2="58" stroke="#98A2B3" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <line x1="515" y1="34" x2="515" y2="58" stroke="#98A2B3" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Aviate Admin -->
  <rect x="40" y="62" width="290" height="104" rx="10" fill="#EFF8FF" stroke="#1570EF" stroke-width="1.2"/>
  <text x="185" y="90" text-anchor="middle" font-size="17" font-weight="600" fill="#175CD3">Aviate Admin</text>
  <text x="185" y="112" text-anchor="middle" font-size="12.5" fill="#1570EF">Environment-level questions</text>
  <text x="185" y="134" text-anchor="middle" font-size="12" fill="#475467">“Which tenant am I on?”</text>
  <text x="185" y="152" text-anchor="middle" font-size="12" fill="#475467">“What is in the catalog today?”</text>

  <!-- Kaui -->
  <rect x="370" y="62" width="290" height="104" rx="10" fill="#ECFDF3" stroke="#039855" stroke-width="1.2"/>
  <text x="515" y="90" text-anchor="middle" font-size="17" font-weight="600" fill="#027A48">Kaui</text>
  <text x="515" y="112" text-anchor="middle" font-size="12.5" fill="#039855">Account-level questions</text>
  <text x="515" y="134" text-anchor="middle" font-size="12" fill="#475467">“Why was this customer charged?”</text>
  <text x="515" y="152" text-anchor="middle" font-size="12" fill="#475467">“Why has this invoice not been paid?”</text>

  <!-- Arrows to Kill Bill -->
  <line x1="185" y1="168" x2="185" y2="214" stroke="#98A2B3" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <line x1="515" y1="168" x2="515" y2="214" stroke="#98A2B3" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <text x="350" y="196" text-anchor="middle" font-size="11.5" fill="#98A2B3" font-style="italic">both read from the same source of truth</text>

  <!-- Kill Bill -->
  <rect x="40" y="218" width="620" height="96" rx="10" fill="#F4F3FF" stroke="#6941C6" stroke-width="1.2"/>
  <text x="350" y="250" text-anchor="middle" font-size="18" font-weight="600" fill="#5925DC">Kill Bill</text>
  <text x="350" y="272" text-anchor="middle" font-size="12.5" fill="#6941C6">Billing engine and system of record</text>
  <text x="350" y="296" text-anchor="middle" font-size="12" fill="#475467">Subscriptions &#183; Invoices &#183; Payments &#183; Audit history</text>

</svg>
